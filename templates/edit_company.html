{% extends "base.html" %}
{% block content %}
<div class="page-container">
    <h2 class="page-title">Edit Company</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" name="name" value="{{ company.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">HR Name</label>
            <input type="text" name="hr_contact" value="{{ company.hr_contact }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">HR Email</label>
            <input type="email" name="hr_email" value="{{ company.hr_email }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Website</label>
            <input type="text" name="website" value="{{ company.website }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control">{{ company.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Update Company</button>
    </form>
</div>
{% endblock %}
