{% extends "base.html" %}
{% block content %}
<div class="page-container">
    <h2 class="mb-4 text-center fw-bold">All Applications</h2>
    {% for a in applications %}
    <div class="custom-card">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">{{ a.student.name }}</h5>
                    <small class="text-muted">{{ a.drive.job_title }}</small>
                </div>

                <span class="badge 
                    {% if a.status == 'Shortlisted' %} bg-warning text-dark
                    {% elif a.status == 'Rejected' %} bg-danger
                    {% elif a.status == 'Selected' %} badge bg-success
                    {% else %} bg-info
                    {% endif %}">
                    {{ a.status }}
                </span>
            </div>

            <div class="mt-3 d-flex gap-2 flex-wrap">
                <a href="{{ url_for('delete_application', app_id=a.id) }}" 
                   class="btn btn-primary btn-sm">
                   Delete
                </a>
            </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
