{% extends "base.html" %}
{% block title %}Create Drive{% endblock %}

{% block content %}
<div class="page-container">

    <div class="custom-card">
        <h3 class="page-title">Create Placement Drive</h3>

        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" class="form-control" name="job_title" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Job Type</label>
                    <input type="text" class="form-control" name="job_type">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea class="form-control" name="description"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Eligibility</label>
                    <input type="text" class="form-control" name="eligibility">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum CGPA</label>
                    <input type="number" step="0.01" class="form-control" name="min_cgpa">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Salary Package</label>
                    <input type="text" class="form-control" name="salary_range">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Application Deadline</label>
                <input type="date" class="form-control" name="deadline">
            </div>
            <div>
                <button type="submit" class="btn btn-success px-4">
                    Create Drive
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
