{% extends "base.html" %}
{% block content %}
<h2>All Students</h2>
{% for s in students %}
<div class="custom-card">
<div class="d-flex justify-content-between align-items-center">
    <div>
       ID: {{s.id}} | {{ s.name }} | Roll no: {{ s.student_id }} <br> 
       CGPA: {{ s.cgpa }} | {{s.phone}}
    </div>
    <div class="d-flex gap-2">
        <a href="{{ s.resume_link }}" target="_blank" class="btn btn-info btn-sm">Resume</a>
        <a href="{{ url_for('edit_student', student_id=s.id) }}" 
           class="btn btn-primary btn-sm">Edit</a>
        <a href="{{ url_for('delete_student', student_id=s.id) }}" 
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure?')">
           Delete </a>
        {% if not s.is_blacklisted %}
        <a href="{{ url_for('blacklist_student', student_id=s.id) }}" 
           class="btn btn-dark btn-sm">Blacklist</a>
        {% else %}
        <a href="{{ url_for('unblacklist_student', student_id=s.id) }}" 
           class="btn btn-success btn-sm">Restore</a>
        {% endif %}
    </div>
</div>
</div>
{% endfor %}
{% endblock %}
